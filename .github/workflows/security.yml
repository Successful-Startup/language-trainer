name: Security

on:
  push:
  pull_request:

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Audit dependencies
        run: |
          python -m pip install pip-audit
          pip-audit

      - name: Validate installed packages
        run: pip check

      - name: Run Django deploy checks
        env:
          DJANGO_SECRET_KEY: this-is-a-long-enough-ci-secret-key-for-deploy-checks
          DJANGO_DEBUG: 'False'
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          DB_DRIVER: django.db.backends.sqlite3
        run: python manage.py check --deploy

      - name: Run tests
        env:
          DJANGO_SECRET_KEY: this-is-a-long-enough-ci-secret-key-for-tests
          DJANGO_DEBUG: 'True'
          DB_DRIVER: django.db.backends.sqlite3
        run: pytest
